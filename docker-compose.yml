services:
  app:
    build:
      context: ./constroi_app
      target: producao
      args:
        API_BASE_URL: /api
    image: constroi-app
    container_name: constroi-app
    depends_on:
      - api
    ports:
      - "8090:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./constroi_api
      target: producao
    image: constroi-api
    container_name: constroi-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure a conexao de execucao}
      AUDITORIA_CONEXAO_ESTRITA: ${AUDITORIA_CONEXAO_ESTRITA-false}
      DATABASE_TRANSACTION_TIMEOUT_MS: ${DATABASE_TRANSACTION_TIMEOUT_MS:-30000}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: ./constroi_api
      target: build
    profiles: ["tools"]
    working_dir: /app
    env_file:
      - path: ./constroi_api/.env.migrations
        required: false
    command: ["dart", "run", "bin/migrate.dart"]

  dev:
    build:
      context: ./constroi_app
      target: build
    image: constroi-app-dev
    container_name: constroi-app-dev
    profiles: ["dev"]
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./constroi_app:/app
      - pub_cache:/root/.pub-cache
    ports:
      - "5000:5000"
    command: >
      sh -c "flutter pub get &&
             flutter run -d web-server --web-hostname 0.0.0.0 --web-port 5000"

volumes:
  pub_cache:
