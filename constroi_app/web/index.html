<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Controle de estoque, materiais e equipamentos de obra.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Constrói">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Constrói</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var atributo = 'flt-semantics-identifier';
      function marcarCampos(no, nome) {
        no.querySelectorAll('input, textarea').forEach(function (campo) {
          campo.setAttribute('data-cy', nome + (campo.disabled ? '-inativo' : '-campo'));
        });
      }
      function marcar(no) {
        var nome = no.getAttribute(atributo);
        no.setAttribute('data-cy', nome);
        marcarCampos(no, nome);
      }
      function espelhar(raiz) {
        if (!raiz || raiz.nodeType !== 1) return;
        if (raiz.hasAttribute(atributo)) marcar(raiz);
        raiz.querySelectorAll('[' + atributo + ']').forEach(marcar);
        var dono = raiz.closest ? raiz.closest('[' + atributo + ']') : null;
        if (dono) marcar(dono);
      }
      new MutationObserver(function (mudancas) {
        mudancas.forEach(function (mudanca) {
          if (mudanca.type === 'attributes') {
            espelhar(mudanca.target);
            return;
          }
          mudanca.addedNodes.forEach(espelhar);
        });
      }).observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: [atributo],
      });
      espelhar(document.body);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
